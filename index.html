<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>LedgerFlow — Mobile Checkbook</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --header-bg: #0f172a;
      --header-card: #1e293b;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #059669;
      --primary-dark: #047857;
      --accent: #2563eb;
      --danger: #dc2626;
      --warning: #d97706;
      --radius: 16px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    body.dark {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1f2937;
      --header-bg: #030712;
      --header-card: #111827;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      min-height: 100dvh;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      transition: background 0.2s, color 0.2s;
    }

    .top-shell {
      background: linear-gradient(160deg, var(--header-bg) 0%, #064e3b 100%);
      color: #ffffff;
      padding: calc(18px + env(safe-area-inset-top)) 16px 22px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      flex-shrink: 0;
    }

    .icon-btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      padding: 7px 10px;
